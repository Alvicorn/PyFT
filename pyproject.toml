[project]
name = "pyvft"
version = "0.1.0"
description = "VerifiedFT: a precise dynamic data race detector for free-threaded Python"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alvin Tsang", email = "alvincytsang@gmail.com" }]
keywords = [
    "data-race",
    "race-detection",
    "free-threaded",
    "concurrency",
    "verifiedft",
    "fasttrack",
    "dynamic-analysis",
    "threading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Alvicorn/pyvft"
Issues = "https://github.com/Alvicorn/pyvft/issues"

[project.scripts]
pyvft = "pyvft.__main__:main"

[dependency-groups]
benchmark = [
    "matplotlib>=3.10.9",
    "psutil>=7.2.2",
]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyvft*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
# addopts = "--cov=pyvft --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
namespace_packages = true

# Tests monkey-patch engine methods, override class attributes, and probe
# private wrapper internals — disable the typing errors that pattern hits.
# Patterns cover both the dotted form (tests.unit.foo.test_bar) used when
# mypy is invoked on the package, and the bare form (test_bar, helpers)
# used when pre-commit passes individual files without __init__.py chains.
[[tool.mypy.overrides]]
module = ["tests.*", "helpers", "conftest"]
disable_error_code = [
    "method-assign",
    "attr-defined",
    "assignment",
    "func-returns-value",
    "arg-type",
    "var-annotated",
    "union-attr",
    "import-not-found",
    "misc",
]

[tool.coverage.run]
source = ["pyvft"]

[tool.coverage.report]
omit = [
    "tests/*",
    "__init__.py"
]
