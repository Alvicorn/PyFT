name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14+freethreaded"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install canonical Python
        run: uv python install 3.14+freethreaded

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest tests/ -v
